<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todolist - 任务管理</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/kanban.css">
  <link rel="stylesheet" href="css/charts.css">
  <link rel="stylesheet" href="css/features.css">
  <script src="js/chromeMock.js"></script>
  <style>
    /* Reset & Widescreen Layout */
    body {
      min-height: 100vh;
      overflow: hidden;
      background-color: var(--bg);
    }

    .app-layout {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Left Sidebar */
    .sidebar {
      width: 260px;
      height: 100%;
      background-color: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: var(--space-xl);
      flex-shrink: 0;
      z-index: 100;
      transition: transform var(--transition-normal);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-2xl);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .sidebar-logo {
      width: 30px;
      height: 30px;
      color: var(--primary);
    }

    .sidebar-title {
      font-size: var(--font-size-2xl);
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
    }

    .btn-close-sidebar {
      display: none;
      color: var(--text-secondary);
      cursor: pointer;
    }

    /* Large Add Task Button */
    .sidebar-add-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-lg);
      background-color: var(--primary);
      color: white !important;
      border-radius: var(--radius-lg);
      font-weight: 600;
      font-size: var(--font-size-lg);
      margin-bottom: var(--space-2xl);
      transition: background-color var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
      box-shadow: 0 4px 12px var(--primary-bg);
      border: none;
    }

    .sidebar-add-btn:hover {
      background-color: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
    }

    .sidebar-add-btn:active {
      transform: translateY(0);
    }

    /* Sidebar sections and menu */
    .sidebar-section {
      margin-bottom: var(--space-2xl);
    }

    .sidebar-section-title {
      font-size: var(--font-size-xs);
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: var(--space-md);
      padding-left: var(--space-sm);
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .sidebar-menu-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-weight: 500;
      font-size: var(--font-size-lg);
      transition: all var(--transition-fast);
      text-align: left;
      width: 100%;
      border: none;
      background: none;
      cursor: pointer;
    }

    .sidebar-menu-btn-content {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .sidebar-menu-btn svg {
      width: 18px;
      height: 18px;
      color: var(--text-secondary);
      transition: color var(--transition-fast);
    }

    .sidebar-menu-btn:hover {
      background-color: var(--border-light);
      color: var(--text);
    }

    .sidebar-menu-btn.active {
      background-color: var(--primary-bg);
      color: var(--primary);
      font-weight: 600;
    }

    .sidebar-menu-btn.active svg {
      color: var(--primary);
    }

    .sidebar-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: var(--space-lg);
      border-top: 1px solid var(--border-light);
      gap: var(--space-sm);
    }

    .sidebar-footer .btn-icon {
      flex: 1;
      height: 38px;
      border-radius: var(--radius-md);
      background-color: var(--border-light);
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar-footer .btn-icon:hover {
      background-color: var(--border);
      color: var(--text);
    }

    /* Right Main Content Area */
    .main-content-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* Mobile Header (Hidden on Desktop) */
    .mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md) var(--space-lg);
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      height: 56px;
      flex-shrink: 0;
    }

    .btn-hamburger {
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      cursor: pointer;
    }

    .btn-hamburger:hover {
      background-color: var(--border-light);
    }

    .mobile-title {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--text);
    }

    /* Main Toolbar Header */
    .main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-lg) var(--space-2xl);
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: var(--space-md);
      flex-shrink: 0;
    }

    .main-header-left {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .current-view-title {
      font-size: var(--font-size-3xl);
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    .main-header-right {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      flex-wrap: wrap;
    }

    .main-header-right .search-box {
      width: 240px;
      transition: width var(--transition-normal);
    }

    .main-header-right .search-box:focus-within {
      width: 320px;
    }

    .main-header-right select {
      height: 34px;
      padding: 0 var(--space-md);
      background-color: var(--border-light);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      font-weight: 500;
      cursor: pointer;
    }

    .main-header-right select:focus {
      background-color: var(--surface);
      border-color: var(--primary);
    }

    /* Views Scrolling Container */
    .views-container {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-2xl);
      background-color: var(--bg);
    }

    /* List View Center Aligned */
    #list-view {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    /* Kanban Widescreen Redesign */
    #kanban-view {
      height: 100%;
      display: flex;
      gap: var(--space-xl);
      overflow-x: auto;
      align-items: stretch;
      width: 100%;
      padding-bottom: var(--space-md);
    }

    #kanban-view.view.active {
      display: flex;
    }

    .kanban-column {
      flex: 1;
      min-width: 280px;
      max-width: 400px;
      background-color: var(--surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 180px);
      /* Stretches to viewport minus header space */
    }

    .kanban-column-content {
      padding: var(--space-md);
      gap: var(--space-md);
      flex: 1;
      overflow-y: auto;
    }

    /* Calendar Widescreen Redesign */
    #calendar-view {
      background-color: var(--surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: var(--space-xl);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 180px);
    }

    #calendar-view.view.active {
      display: flex;
    }

    .calendar-header {
      margin-bottom: var(--space-lg);
      flex-shrink: 0;
    }

    .calendar-grid {
      margin-bottom: var(--space-sm);
      flex-shrink: 0;
    }

    .calendar-days {
      flex: 1;
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 1px;
      background-color: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .calendar-day {
      aspect-ratio: auto;
      height: 100%;
      background-color: var(--surface);
      border-radius: 0;
      justify-content: flex-start;
      align-items: flex-start;
      padding: var(--space-sm);
      transition: background-color var(--transition-fast);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .calendar-day-number {
      font-size: var(--font-size-md);
      font-weight: 600;
      margin-bottom: var(--space-xs);
    }

    .calendar-day.today .calendar-day-number {
      background-color: var(--primary);
      color: white;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs);
    }

    /* Calendar task cells inside grid */
    .calendar-day-tasks {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
      overflow-y: auto;
      margin-top: var(--space-xs);
      flex: 1;
      max-height: calc(100% - 22px);
    }

    /* Small custom scrollbar for calendar day cells */
    .calendar-day-tasks::-webkit-scrollbar {
      width: 3px;
    }

    .calendar-task-indicator {
      font-size: 10px;
      padding: 2px 6px;
      background-color: var(--border-light);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 3px solid var(--priority-color, var(--border));
      width: 100%;
      text-align: left;
      line-height: 1.3;
    }

    .calendar-task-indicator.completed {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .calendar-task-indicator-more {
      font-size: 9px;
      color: var(--primary);
      font-weight: 600;
      padding-left: var(--space-xs);
      text-align: left;
    }

    /* Stats View Dashboard grid layout */
    #stats-view {
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    #stats-view.view.active {
      display: block;
    }

    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-xl);
      padding: 0;
    }

    .stats-header {
      grid-column: 1 / -1;
      margin-bottom: 0;
    }

    .stats-overview {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(4, 1fr) !important;
      gap: var(--space-md) !important;
      margin-bottom: 0 !important;
    }

    .stats-progress {
      grid-column: 1 / -1;
      margin-bottom: 0 !important;
    }

    .stats-chart {
      grid-column: 1;
      margin-bottom: 0 !important;
    }

    .stats-info {
      grid-column: 1;
      margin-bottom: 0 !important;
    }

    .stats-distribution {
      grid-column: 2;
      margin-bottom: 0 !important;
    }

    /* Batch operations bar desktop placement override */
    .batch-bar {
      bottom: var(--space-xl);
      left: calc(260px + (100% - 260px) / 2);
      transform: translateX(-50%) translateY(calc(100% + 100px));
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      width: calc(100% - 320px);
      max-width: 600px;
      margin: 0;
      box-shadow: var(--shadow-xl), 0 10px 25px -5px rgba(0, 0, 0, 0.15);
      z-index: var(--z-dropdown, 100);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease, visibility 0.25s ease;
    }

    .batch-bar.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Responsive Queries */
    @media (max-width: 1024px) {
      .batch-bar {
        left: calc(260px + (100% - 260px) / 2);
        width: calc(100% - 300px);
      }
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .app-layout {
        flex-direction: column;
      }

      /* Sidebar collapses to sliding drawer */
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        box-shadow: var(--shadow-xl);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .btn-close-sidebar {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: var(--radius-md);
      }

      .btn-close-sidebar:hover {
        background-color: var(--border-light);
      }

      .mobile-header {
        display: flex;
      }

      .main-content-layout {
        height: calc(100vh - 56px);
      }

      .main-header {
        padding: var(--space-md) var(--space-lg);
        flex-direction: column;
        align-items: stretch;
      }

      .main-header-right {
        justify-content: space-between;
      }

      .main-header-right .search-box {
        width: 100%;
      }

      .main-header-right .search-box:focus-within {
        width: 100%;
      }

      .views-container {
        padding: var(--space-md);
      }

      .stats-container {
        grid-template-columns: 1fr;
      }

      .stats-chart,
      .stats-info,
      .stats-distribution {
        grid-column: 1;
      }

      .stats-overview {
        grid-template-columns: repeat(2, 1fr) !important;
      }

      .batch-bar {
        left: 50% !important;
        transform: translateX(-50%) translateY(calc(100% + 100px)) !important;
        width: calc(100% - 32px) !important;
        bottom: var(--space-md) !important;
      }

      .batch-bar.show {
        transform: translateX(-50%) translateY(0) !important;
      }
    }
  </style>
</head>

<body>
  <div class="app-layout">
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <svg class="sidebar-logo" viewBox="0 0 24 24">
            <path fill="currentColor"
              d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
          </svg>
          <h1 class="sidebar-title">Todolist</h1>
        </div>
        <button id="btn-close-sidebar" class="btn-close-sidebar" title="关闭菜单">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor"
              d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
          </svg>
        </button>
      </div>

      <!-- Add Task Action -->
      <button id="btn-add" class="sidebar-add-btn" title="添加新任务">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
        </svg>
        添加任务
      </button>

      <!-- View Selector -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">视图</div>
        <nav class="sidebar-menu">
          <button class="sidebar-menu-btn sidebar-view-btn active" data-view="list">
            <div class="sidebar-menu-btn-content">
              <svg viewBox="0 0 24 24">
                <path fill="currentColor"
                  d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z" />
              </svg>
              <span>列表视图</span>
            </div>
          </button>
          <button class="sidebar-menu-btn sidebar-view-btn" data-view="kanban">
            <div class="sidebar-menu-btn-content">
              <svg viewBox="0 0 24 24">
                <path fill="currentColor"
                  d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 19H5v-6h2v6zm0-8H5V5h2v6zm6 8h-2v-4h2v4zm0-6h-2V5h2v6zm6 6h-2v-8h2v8z" />
              </svg>
              <span>看板分栏</span>
            </div>
          </button>
          <button class="sidebar-menu-btn sidebar-view-btn" data-view="calendar">
            <div class="sidebar-menu-btn-content">
              <svg viewBox="0 0 24 24">
                <path fill="currentColor"
                  d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z" />
              </svg>
              <span>日历视图</span>
            </div>
          </button>
          <button class="sidebar-menu-btn sidebar-view-btn" data-view="stats">
            <div class="sidebar-menu-btn-content">
              <svg viewBox="0 0 24 24">
                <path fill="currentColor"
                  d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z" />
              </svg>
              <span>统计分析</span>
            </div>
          </button>
        </nav>
      </div>

      <!-- Filters (mapped to .filter-tabs) -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">过滤器</div>
        <nav class="sidebar-menu filter-tabs">
          <button class="sidebar-menu-btn tab active" data-filter="all">
            <div class="sidebar-menu-btn-content">
              <span>📂</span>
              <span>全部任务</span>
            </div>
          </button>
          <button class="sidebar-menu-btn tab" data-filter="today">
            <div class="sidebar-menu-btn-content">
              <span>📅</span>
              <span>今天任务</span>
            </div>
          </button>
          <button class="sidebar-menu-btn tab" data-filter="upcoming">
            <div class="sidebar-menu-btn-content">
              <span>📋</span>
              <span>即将到来</span>
            </div>
          </button>
          <button class="sidebar-menu-btn tab" data-filter="overdue">
            <div class="sidebar-menu-btn-content">
              <span>⚠️</span>
              <span>已逾期</span>
            </div>
          </button>
          <button class="sidebar-menu-btn tab" data-filter="completed">
            <div class="sidebar-menu-btn-content">
              <span>✅</span>
              <span>已完成</span>
            </div>
          </button>
        </nav>
      </div>

      <!-- Footer action tools -->
      <div class="sidebar-footer">
        <button id="btn-theme" class="btn-icon" title="切换主题">☀️</button>
        <button id="btn-templates" class="btn-icon" title="任务模板">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor"
              d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
          </svg>
        </button>
        <button id="btn-settings" class="btn-icon" title="设置">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor"
              d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main Content Layout Area -->
    <div class="main-content-layout">
      <!-- Mobile View Header -->
      <header class="mobile-header">
        <button id="btn-menu-toggle" class="btn-hamburger" title="展开侧边栏">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
          </svg>
        </button>
        <span class="mobile-title">Todolist</span>
        <button id="btn-mobile-add" class="btn-icon" title="添加任务">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
          </svg>
        </button>
      </header>

      <!-- Main Toolbar Header -->
      <header class="main-header">
        <div class="main-header-left" style="display: flex; align-items: center; gap: var(--space-md);">
          <h2 id="current-view-title" class="current-view-title">任务列表</h2>
          <div class="header-progress-widget" id="header-progress-widget" title="今日任务完成率"></div>
        </div>
        <div class="main-header-right">
          <!-- Search box -->
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16">
              <path fill="currentColor"
                d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
            </svg>
            <input type="text" id="search-input" placeholder="搜索任务..." autocomplete="off" list="search-suggestions">
            <datalist id="search-suggestions"></datalist>
          </div>
          <!-- Priority Selector -->
          <select id="filter-select" class="filter-select">
            <option value="all">全部优先级</option>
            <option value="high">高优先级</option>
            <option value="medium">中优先级</option>
            <option value="low">低优先级</option>
          </select>
          <!-- Category Selector -->
          <select id="category-select" class="filter-select">
            <option value="all">全部分类</option>
            <option value="工作">💼 工作</option>
            <option value="个人">👤 个人</option>
            <option value="学习">📚 学习</option>
            <option value="生活">🏠 生活</option>
            <option value="健康">💪 健康</option>
          </select>
          <!-- Sort Selector -->
          <select id="sort-select" class="filter-select">
            <option value="dueDate">按日期</option>
            <option value="priority">按优先级</option>
            <option value="created">按创建时间</option>
            <option value="alpha">按名称</option>
          </select>
          <button id="btn-zotero-window-mode" class="btn-icon zotero-only" title="切换显示模式 (伴读子窗口 / 独立窗口 / 标签页)">🗗</button>
          <button id="btn-zotero-prefs" class="btn-icon zotero-only" title="打开 Todolist 首选项设置">⚙️</button>
          <!-- View cycle button hidden but preserved in DOM for JS binding -->
          <button id="btn-toggle-view" style="display: none;"></button>
        </div>
      </header>

      <!-- Scrollable Panels Viewport -->
      <main class="views-container">
        <!-- List View -->
        <div id="list-view" class="view active">
          <div id="task-list" class="task-list">
            <!-- Tasks rendered dynamically -->
          </div>
          <div id="empty-state" class="empty-state hidden">
            <svg viewBox="0 0 24 24" width="64" height="64">
              <path fill="currentColor" opacity="0.3"
                d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
            </svg>
            <p>还没有任务</p>
            <button id="btn-add-first" class="btn-primary">添加第一个任务</button>
          </div>
        </div>

        <!-- Calendar View -->
        <div id="calendar-view" class="view hidden">
          <div class="calendar-header">
            <button id="btn-prev-month" class="btn-icon">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
              </svg>
            </button>
            <h2 id="calendar-title"></h2>
            <button id="btn-next-month" class="btn-icon">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
              </svg>
            </button>
          </div>
          <div class="calendar-grid">
            <div class="weekday">日</div>
            <div class="weekday">一</div>
            <div class="weekday">二</div>
            <div class="weekday">三</div>
            <div class="weekday">四</div>
            <div class="weekday">五</div>
            <div class="weekday">六</div>
          </div>
          <div id="calendar-days" class="calendar-days">
            <!-- Days rendered dynamically -->
          </div>
        </div>

        <!-- Kanban View -->
        <div id="kanban-view" class="view hidden">
          <!-- Columns rendered dynamically -->
        </div>

        <!-- Stats View -->
        <div id="stats-view" class="view hidden">
          <!-- Statistics rendered dynamically -->
        </div>
      </main>
    </div>
  </div>

  <!-- Batch operations bar -->
  <div id="batch-bar" class="batch-bar">
    <span class="batch-info">已选择 <strong>0</strong> 个任务</span>
    <div class="batch-actions">
      <button id="btn-batch-complete" class="batch-btn complete">完成</button>
      <button id="btn-batch-delete" class="batch-btn delete">删除</button>
      <button id="btn-batch-cancel" class="batch-btn cancel">取消</button>
    </div>
  </div>

  <!-- Add/Edit Task Modal -->
  <dialog id="task-modal" class="modal">
    <form id="task-form" class="modal-form">
      <div class="modal-header">
        <div class="modal-header-title">
          <span class="modal-header-icon">✨</span>
          <h2 id="modal-title">添加任务</h2>
        </div>
        <button type="button" id="btn-close-modal-x" class="modal-close-btn" title="关闭 (Esc)">×</button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="task-id">

      <!-- Academic Task Type Segmented Switcher -->
      <div class="academic-type-section zotero-only">
        <label class="academic-type-label">🎓 学术场景类型</label>
        <div class="academic-type-segmented" id="academic-type-segmented">
          <button type="button" class="academic-seg-btn active" data-type="literature_reading">📖 论文研读</button>
          <button type="button" class="academic-seg-btn" data-type="writing">✍️ 论文写作</button>
          <button type="button" class="academic-seg-btn" data-type="experiment">🔬 实验复现</button>
          <button type="button" class="academic-seg-btn" data-type="submission">⏰ 截稿 DDL</button>
          <button type="button" class="academic-seg-btn" data-type="peer_review">📑 同行审稿</button>
          <button type="button" class="academic-seg-btn" data-type="general">📌 通用待办</button>
        </div>
        <input type="hidden" id="task-academic-type" value="literature_reading">
      </div>

      <div class="form-group">
        <label for="task-title">任务标题 *</label>
        <input type="text" id="task-title" required placeholder="准备做些什么？" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="task-description">任务细节与描述</label>
        <textarea id="task-description" rows="2" placeholder="添加备注或详细说明（可选）"></textarea>
      </div>

      <!-- Date & Time Section Card -->
      <div class="date-time-card">
        <div class="date-field-section">
          <div class="field-header">
            <label for="task-due-date" class="icon-label">📅 截止日期</label>
            <button type="button" id="btn-clear-due-date" class="btn-text-action" title="清除日期">清除</button>
          </div>
          <div class="date-input-row">
            <input type="date" id="task-due-date" class="styled-datetime-input">
            <div class="quick-date-pills">
              <button type="button" class="date-pill" data-date="today">今天</button>
              <button type="button" class="date-pill" data-date="tomorrow">明天</button>
              <button type="button" class="date-pill" data-date="next-monday">下周一</button>
            </div>
          </div>
        </div>

        <div class="time-field-section">
          <input type="hidden" id="task-due-time">

          <div id="time-trigger-bar" class="time-trigger-bar">
            <button type="button" id="btn-toggle-time-picker" class="time-trigger-btn">
              <span class="time-trigger-icon">⏰</span>
              <span id="time-trigger-text">设置具体时间 (可选)</span>
            </button>
            <button type="button" id="btn-clear-due-time" class="btn-text-action hidden" title="清除时间">清除时间</button>
          </div>

          <div id="time-selection-strip" class="time-selection-strip hidden">
            <div class="time-presets-toolbar">
              <button type="button" class="time-pill" data-time="09:00">🌅 09:00</button>
              <button type="button" class="time-pill" data-time="12:00">☀️ 12:00</button>
              <button type="button" class="time-pill" data-time="14:00">🍱 14:00</button>
              <button type="button" class="time-pill" data-time="18:00">🌆 18:00</button>
              <button type="button" class="time-pill" data-time="20:00">🌙 20:00</button>
            </div>

            <div class="time-custom-row">
              <span class="custom-time-label">自定义:</span>
              <select id="task-due-hour" class="styled-select-time">
                <option value="">-- 时 --</option>
                <option value="06">06 时</option>
                <option value="07">07 时</option>
                <option value="08">08 时</option>
                <option value="09">09 时</option>
                <option value="10">10 时</option>
                <option value="11">11 时</option>
                <option value="12">12 时</option>
                <option value="13">13 时</option>
                <option value="14">14 时</option>
                <option value="15">15 时</option>
                <option value="16">16 时</option>
                <option value="17">17 时</option>
                <option value="18">18 时</option>
                <option value="19">19 时</option>
                <option value="20">20 时</option>
                <option value="21">21 时</option>
                <option value="22">22 时</option>
                <option value="23">23 时</option>
              </select>
              <span class="time-colon">:</span>
              <select id="task-due-minute" class="styled-select-time">
                <option value="00">00 分</option>
                <option value="15">15 分</option>
                <option value="30">30 分</option>
                <option value="45">45 分</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Zotero Literature Association Card Section -->
      <div id="modal-literature-section" class="modal-literature-section"></div>

      <div class="form-group">
        <label>优先级</label>
        <div class="priority-options">
          <label class="priority-option">
            <input type="radio" name="priority" value="low">
            <span class="priority-label low"><i class="dot low-dot"></i>低</span>
          </label>
          <label class="priority-option">
            <input type="radio" name="priority" value="medium" checked>
            <span class="priority-label medium"><i class="dot medium-dot"></i>中</span>
          </label>
          <label class="priority-option">
            <input type="radio" name="priority" value="high">
            <span class="priority-label high"><i class="dot high-dot"></i>高</span>
          </label>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label for="task-category">所属分类</label>
          <input type="text" id="task-category" placeholder="工作、个人、学习..." list="category-list" autocomplete="off">
          <datalist id="category-list"></datalist>
        </div>
        <div class="form-group flex-1">
          <label for="task-repeat">重复周期</label>
          <select id="task-repeat" class="repeat-select">
            <option value="">不重复</option>
            <option value="daily">🔄 每天</option>
            <option value="weekly">📅 每周</option>
            <option value="biweekly">📆 每两周</option>
            <option value="monthly">🗓️ 每月</option>
            <option value="quarterly">📊 每季度</option>
            <option value="yearly">🎯 每年</option>
          </select>
        </div>
      </div>

      <div class="form-group reminder-group">
        <div class="reminder-toggle-row">
          <label class="checkbox-label">
            <input type="checkbox" id="task-reminder">
            <span>🔔 开启定时提醒</span>
          </label>
        </div>
        <select id="task-reminder-before" class="reminder-select" style="display:none; margin-top: 8px;">
          <option value="5">提前 5 分钟</option>
          <option value="15" selected>提前 15 分钟</option>
          <option value="30">提前 30 分钟</option>
          <option value="60">提前 1 小时</option>
          <option value="1440">提前 1 天</option>
        </select>
      </div>

      <div class="form-group subtasks-group">
        <div class="subtask-header-row" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <label style="margin:0;">子任务与精读里程碑</label>
          <button type="button" id="btn-inject-milestones" class="btn-text-action zotero-only" style="color:var(--primary,#059669);font-weight:600;display:inline-flex;align-items:center;gap:4px;" title="一键填入标准的 5 项论文研读里程碑">
            ⚡ 填入 5 步精读清单
          </button>
        </div>
        <div id="subtasks-list" class="subtask-list">
          <!-- Subtasks will be rendered here -->
        </div>
        <div class="subtask-input-group">
          <input type="text" id="subtask-input" placeholder="+ 添加子任务步骤 (按 Enter 快速添加)..." autocomplete="off">
          <button type="button" id="btn-add-subtask" class="subtask-add-btn">+ 添加</button>
        </div>
      </div>

      <div class="form-group" id="tags-container">
        <!-- Tags will be rendered here -->
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" id="btn-cancel" class="btn-secondary">取消</button>
      <button type="submit" class="btn-primary">保存任务</button>
    </div>
    </form>
  </dialog>

  <dialog id="settings-modal" class="modal">
    <div class="modal-form">
      <div class="modal-header">
        <div class="modal-header-title">
          <span class="modal-header-icon">⚙️</span>
          <h2>设置</h2>
        </div>
        <button type="button" id="btn-close-settings-x" class="modal-close-btn" title="关闭 (Esc)">×</button>
      </div>
      <div class="modal-body">
        <div class="settings-group">
        <div class="settings-group-title">数据导出</div>
        <div class="data-actions">
          <button id="btn-export-json" class="data-btn">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor"
                d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z" />
            </svg>
            导出 JSON
          </button>
          <button id="btn-export-csv" class="data-btn">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor"
                d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z" />
            </svg>
            导出 CSV
          </button>
          <button id="btn-export-md" class="data-btn">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor"
                d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z" />
            </svg>
            导出 Markdown
          </button>
          <button id="btn-export-txt" class="data-btn">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor"
                d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z" />
            </svg>
            导出 TXT
        </div>
      </div>
      <div class="settings-group">
        <div class="settings-group-title">自定义标签</div>
        <div id="settings-tags-container">
          <!-- Rendered dynamically by Tags.renderCustomTagsManager() -->
        </div>
      </div>
      <div class="settings-group">
        <div class="settings-group-title">数据导入</div>
        <div class="data-actions">
          <button id="btn-import-data" class="data-btn">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor"
                d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z" />
            </svg>
            导入 JSON 数据
          </button>
        </div>
      </div>
      <div class="settings-group">
        <div class="settings-group-title">其他操作</div>
        <div class="data-actions">
          <button id="btn-print" class="data-btn">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor"
                d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z" />
            </svg>
            打印任务
          </button>
          <button id="btn-share-summary" class="data-btn">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor"
                d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z" />
            </svg>
            分享任务概览
          </button>
          <button id="btn-clear-data" class="data-btn danger">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor"
                d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
            </svg>
            清除所有数据
          </button>
        </div>
      </div>
      <div class="settings-group zotero-only">
        <div class="settings-group-title">Zotero 首选项联动</div>
        <p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">在 Zotero 原生插件偏好设置面板中配置窗口模式、侧边栏、子笔记云同步与自动打标规则。</p>
        <button id="btn-open-zotero-prefs" class="data-btn" style="width:100%;justify-content:center;">⚙️ 打开 Zotero 首选项设置</button>
      </div>
      </div>
      <div class="modal-actions">
        <button type="button" id="btn-close-settings" class="btn-secondary">关闭</button>
      </div>
    </div>
  </dialog>

  <!-- Import file target -->
  <input type="file" id="import-file" class="file-input" accept=".json">

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden">
    <span id="toast-message"></span>
    <button id="toast-action" class="toast-action hidden">撤销</button>
  </div>

  <script src="js/ui.js"></script>
