<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- 顶部文献流渐变 -->
    <linearGradient id="todo-bar-1" x1="16" y1="28" x2="88" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0.85" />
    </linearGradient>

    <!-- 中部文献流渐变 -->
    <linearGradient id="todo-bar-2" x1="16" y1="56" x2="72" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#FDA4AF" stop-opacity="0.9" />
    </linearGradient>

    <!-- 破界主对勾渐变 -->
    <linearGradient id="unbounded-check" x1="20" y1="96" x2="114" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9F1239" />
      <stop offset="45%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 悬浮焦点微光 -->
    <linearGradient id="zotero-spark" x1="92" y1="14" x2="112" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <!-- 柔和的弥散投影（非边框，仅增强无边界悬浮感） -->
    <filter id="ambient-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.14" />
    </filter>
  </defs>

  <g filter="url(#ambient-glow)">
    <!-- 第一层：待办文献条目 1（开放式胶囊流 + 悬浮状态点） -->
    <circle cx="24" cy="30" r="7" fill="#E11D48" />
    <rect x="40" y="23" width="52" height="14" rx="7" fill="url(#todo-bar-1)" />

    <!-- 第二层：待办文献条目 2（向内缩进，形成给对勾让位的负空间） -->
    <circle cx="24" cy="58" r="7" fill="#F43F5E" />
    <rect x="40" y="51" width="34" height="14" rx="7" fill="url(#todo-bar-2)" />

    <!-- 第三层：破界而出的动态对勾 -->
    <path d="M 22 86 
             L 46 108 
             C 50 111.5, 56 111, 59.5 106.5 
             L 112 38" 
          stroke="url(#unbounded-check)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 破界星芒/高优标记 -->
    <path d="M 102 12 C 102 19, 105 22, 112 22 C 105 22, 102 25, 102 32 C 102 25, 99 22, 92 22 C 99 22, 102 19, 102 12 Z" 
          fill="url(#zotero-spark)" />
  </g>
</svg>
