<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="time-arc" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="pulse-dot" x1="94" y1="18" x2="114" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
  </defs>
  <!-- 开放式非闭合时间轨迹弧 -->
  <path d="M 108 76 A 46 46 0 1 1 76 20" stroke="url(#time-arc)" stroke-width="14" stroke-linecap="round" />
  <!-- 时间指针 -->
  <path d="M 64 40 V 66 L 84 78" stroke="#0284C7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 右上角破界跃动点 -->
  <circle cx="104" cy="28" r="12" fill="url(#pulse-dot)" />
</svg>