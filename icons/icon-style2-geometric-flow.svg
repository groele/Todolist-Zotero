<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Cyber Midnight -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Zotero Letter Z Gradient (Rose-Crimson to Electric Violet) -->
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="40%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Glowing Checkmark Gradient (Cyan to Vivid Emerald) -->
    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="ambientGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="neonGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadowZ" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="checkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064E3B" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad2)" />
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Ambient Light Orb -->
  <circle cx="256" cy="256" r="190" fill="url(#ambientGlow2)" />

  <!-- Academic Coordinate / Grid Accents -->
  <g opacity="0.12" fill="#94A3B8">
    <circle cx="110" cy="110" r="3" /><circle cx="150" cy="110" r="3" /><circle cx="190" cy="110" r="3" />
    <circle cx="110" cy="150" r="3" /><circle cx="150" cy="150" r="3" /><circle cx="190" cy="150" r="3" />
    <circle cx="320" cy="360" r="3" /><circle cx="360" cy="360" r="3" /><circle cx="400" cy="360" r="3" />
    <circle cx="320" cy="400" r="3" /><circle cx="360" cy="400" r="3" /><circle cx="400" cy="400" r="3" />
  </g>

  <!-- BACKGROUND GLYPH: Bold Modern Geometric 'Z' (Zotero) -->
  <g filter="url(#shadowZ)">
    <!-- Main Z Path with Rounded Terminals -->
    <path d="M 140 168 H 372 C 386 168 392 184 382 196 L 180 376 H 372"
          fill="none"
          stroke="url(#zGrad)"
          stroke-width="48"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Glass Highlights along Z -->
    <path d="M 152 166 H 360"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="10"
          stroke-linecap="round"
          opacity="0.75" />
  </g>

  <!-- FOREGROUND GLYPH: High-Voltage Soaring Checkmark (Todolist ✓) -->
  <g filter="url(#checkShadow)">
    <!-- Ambient Glow behind Checkmark -->
    <path d="M 194 300 L 254 366 L 396 178"
          fill="none"
          stroke="url(#checkGrad)"
          stroke-width="56"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.5"
          filter="url(#neonGlow2)" />

    <!-- Crisp Checkmark -->
    <path d="M 194 300 L 254 366 L 396 178"
          fill="none"
          stroke="url(#checkGrad)"
          stroke-width="48"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Inner Core Specular Light -->
    <path d="M 200 300 L 254 360 L 390 182"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.85" />
  </g>

  <!-- Apex Sparkle / Milestone Star -->
  <g transform="translate(396, 178)">
    <path d="M 0 -20 L 5 -5 L 20 0 L 5 5 L 0 20 L -5 5 L -20 0 L -5 -5 Z" fill="#6EE7B7" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- Bottom-Left Status Indicator Dots -->
  <g filter="url(#shadowZ)">
    <circle cx="116" cy="376" r="12" fill="#F43F5E" />
    <circle cx="116" cy="376" r="12" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <circle cx="116" cy="336" r="9" fill="#F59E0B" opacity="0.85" />
  </g>
</svg>
