<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Slate Obsidian -->
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Kanban Flow Arc Gradient: Blue -> Purple -> Emerald -->
    <linearGradient id="kanbanArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Column Shadows -->
    <filter id="columnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="cardShadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad6)" />
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Background Curved Flow Arc Connecting 3 Kanban Stages -->
  <path d="M 120 370 C 180 430 330 430 392 370" fill="none" stroke="url(#kanbanArc)" stroke-width="8" stroke-linecap="round" opacity="0.4" />
  <path d="M 110 130 C 190 70 320 70 402 130" fill="none" stroke="url(#kanbanArc)" stroke-width="6" stroke-linecap="round" opacity="0.25" stroke-dasharray="8 6" />

  <!-- Zotero Top Accent Bookmark Tab -->
  <path d="M 238 34 L 274 34 L 274 74 L 256 60 L 238 74 Z" fill="#DC2626" />

  <!-- THREE KANBAN COLUMNS -->

  <!-- COLUMN 1: TO-READ / 待研读 (Sky Blue Theme) -->
  <g filter="url(#columnShadow)">
    <rect x="94" y="152" width="96" height="236" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <!-- Column Header Pill & Label -->
    <circle cx="118" cy="178" r="6" fill="#38BDF8" />
    <rect x="132" y="174" width="42" height="8" rx="4" fill="#94A3B8" />

    <!-- Card 1.1 -->
    <g filter="url(#cardShadow6)">
      <rect x="104" y="198" width="76" height="64" rx="10" fill="#FFFFFF" />
      <rect x="114" y="210" width="56" height="7" rx="3.5" fill="#1E293B" />
      <rect x="114" y="223" width="38" height="6" rx="3" fill="#94A3B8" />
      <!-- Mini doc tag -->
      <rect x="114" y="238" width="28" height="12" rx="4" fill="#E0F2FE" />
      <text x="128" y="247" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="700" fill="#0284C7" text-anchor="middle">DOC</text>
    </g>

    <!-- Card 1.2 -->
    <g filter="url(#cardShadow6)">
      <rect x="104" y="272" width="76" height="52" rx="10" fill="#FFFFFF" opacity="0.9" />
      <rect x="114" y="284" width="50" height="7" rx="3.5" fill="#334155" />
      <rect x="114" y="297" width="32" height="6" rx="3" fill="#CBD5E1" />
    </g>
  </g>

  <!-- COLUMN 2: IN PROGRESS / 精读中 (Violet / Zotero Purple - Elevated & Taller) -->
  <g filter="url(#columnShadow)">
    <rect x="208" y="118" width="96" height="278" rx="18" fill="#241B35" stroke="#7C3AED" stroke-width="2" />
    <!-- Column Header Pill & Active Glow -->
    <circle cx="232" cy="144" r="6" fill="#C084FC" />
    <rect x="246" y="140" width="42" height="8" rx="4" fill="#E9D5FF" />

    <!-- Card 2.1 (Active Reading Focus Card with Page Anchor) -->
    <g filter="url(#cardShadow6)">
      <rect x="218" y="164" width="76" height="84" rx="10" fill="#FFFFFF" />
      <rect x="228" y="176" width="56" height="8" rx="4" fill="#0F172A" />
      <rect x="228" y="190" width="44" height="6" rx="3" fill="#64748B" />
      <!-- Reading Anchor Badge -->
      <rect x="228" y="206" width="56" height="18" rx="9" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="1.2" />
      <text x="256" y="219" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="800" fill="#7E22CE" text-anchor="middle">📖 P.32</text>
      <!-- Mini Timer Dot -->
      <circle cx="234" cy="235" r="3" fill="#10B981" />
      <text x="242" y="238" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="600" fill="#64748B">25 min</text>
    </g>

    <!-- Card 2.2 -->
    <g filter="url(#cardShadow6)">
      <rect x="218" y="258" width="76" height="54" rx="10" fill="#FFFFFF" opacity="0.9" />
      <rect x="228" y="270" width="48" height="7" rx="3.5" fill="#334155" />
      <rect x="228" y="283" width="34" height="6" rx="3" fill="#94A3B8" />
    </g>
  </g>

  <!-- COLUMN 3: DONE / 已完成 (Emerald Green Theme) -->
  <g filter="url(#columnShadow)">
    <rect x="322" y="152" width="96" height="236" rx="18" fill="#132E27" stroke="#059669" stroke-width="1.5" />
    <!-- Column Header Pill & Label -->
    <circle cx="346" cy="178" r="6" fill="#34D399" />
    <rect x="360" y="174" width="42" height="8" rx="4" fill="#A7F3D0" />

    <!-- Card 3.1 (Done Card with Big Emerald Checkmark) -->
    <g filter="url(#cardShadow6)">
      <rect x="332" y="198" width="76" height="74" rx="10" fill="#FFFFFF" />
      <rect x="342" y="210" width="56" height="7" rx="3.5" fill="#94A3B8" opacity="0.7" />
      <line x1="340" y1="213" x2="398" y2="213" stroke="#10B981" stroke-width="1.8" />
      <!-- Big Completed Badge -->
      <circle cx="370" cy="242" r="14" fill="#10B981" />
      <path d="M 364 242 L 368 246 L 376 238" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Card 3.2 (Done Card) -->
    <g filter="url(#cardShadow6)">
      <rect x="332" y="282" width="76" height="52" rx="10" fill="#FFFFFF" opacity="0.85" />
      <rect x="342" y="294" width="44" height="7" rx="3.5" fill="#94A3B8" opacity="0.7" />
      <line x1="340" y1="297" x2="386" y2="297" stroke="#10B981" stroke-width="1.5" />
      <circle cx="372" cy="316" r="8" fill="#D1FAE5" />
      <path d="M 369 316 L 371 318 L 375 314" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>
</svg>
